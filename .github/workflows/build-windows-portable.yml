name: Build SExtract Windows portable

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "script.js"
      - "style.css"
      - "favicon.ico"
      - "windows/**"
      - ".github/workflows/build-windows-portable.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Prepare embedded web app
        shell: pwsh
        run: |
          $web = Join-Path $env:GITHUB_WORKSPACE "windows/www"
          New-Item -ItemType Directory -Force -Path $web | Out-Null
          foreach ($file in @("index.html", "script.js", "style.css", "favicon.ico")) {
            $source = Join-Path $env:GITHUB_WORKSPACE $file
            if (!(Test-Path $source)) { throw "Missing required web file: $file" }
            Copy-Item $source (Join-Path $web $file) -Force
          }

      - name: Publish portable Windows x64 executable
        run: >-
          dotnet publish windows/SExtract.Desktop.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          --output dist

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: SExtract-Portable-Windows-x64
          path: dist/SExtract.exe
          if-no-files-found: error
          retention-days: 30
